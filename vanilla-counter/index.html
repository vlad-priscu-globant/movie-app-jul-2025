<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Counter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
        }
        .counter-container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .count-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 1rem 0;
            color: #333;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1.2rem;
            margin: 0 0.5rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .warning {
            color: red;
            margin-top: 1rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <h2>Vanilla JS Counter</h2>
        <div class="count-display" id="count-display">0</div>
        <div>
            <button id="btn-decrement">-</button>
            <button id="btn-increment">+</button>
        </div>
        <div class="warning" id="warning-message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
